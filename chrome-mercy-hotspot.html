<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chrome Mercy Studio — Interior Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:            #000000;
    --bg-panel:      #070f09;
    --accent:        #B4966E;
    --accent-bright: #C8A87A;
    --accent-dim:    rgba(180,150,110,0.2);
    --accent-border: rgba(180,150,110,0.32);
    --green:         #1B3A24;
    --green-bright:  #2A5C38;
    --green-vivid:   #3A8C52;
    --text-white:    #ffffff;
    --text-primary:  #f5f5f5;
    --text-secondary:#c8c4bc;
    --text-muted:    #4a4a44;
    --border:        rgba(180,150,110,0.15);
    --border-strong: rgba(180,150,110,0.32);
    --font-heading:  'Cormorant Garamond', serif;
    --font-body:     'Inter', sans-serif;
  }

html, body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .cm-tool {
    max-width: 1100px;
    margin: 0 auto;
    padding: 44px 24px 64px;
  }

  /* Header */
  .cm-header { text-align: center; margin-bottom: 32px; }
  .cm-header__eyebrow {
    font-family: var(--font-body);
    font-weight: 300;
    font-size: 10px;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--green-vivid);
    margin-bottom: 14px;
  }
  .cm-header__title {
    font-family: var(--font-heading);
    font-weight: 300;
    font-size: clamp(30px, 4vw, 46px);
    letter-spacing: 0.04em;
    color: var(--text-white);
    margin-bottom: 10px;
    font-style: italic;
  }
  .cm-header__subtitle {
    font-family: var(--font-body);
    font-weight: 300;
    font-size: 10px;
    letter-spacing: 0.22em;
    color: var(--text-secondary);
    text-transform: uppercase;
  }

  /* Divider */
  .cm-divider { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; }
  .cm-divider__line {
    flex: 1; height: 0;
    border-top: 1px dashed var(--border-strong);  /* saddle-stitch hairline */
  }
  .cm-divider__arch { width: 30px; height: 30px; color: var(--accent-bright); flex-shrink: 0; }

  /* Nav */
  .cm-nav {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    border-bottom: 1px dashed var(--border-strong);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .cm-nav::-webkit-scrollbar { display: none; }
  .cm-nav__btn {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    padding: 12px 16px;
    cursor: pointer;
    font-family: var(--font-body);
    font-weight: 400;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
    white-space: nowrap;
    transition: color 0.3s ease, border-color 0.3s ease;
    flex-shrink: 0;
  }
  .cm-nav__btn:hover { color: var(--text-secondary); }
  .cm-nav__btn.active { color: var(--accent-bright); border-bottom-color: var(--accent-bright); }

  /* Back bar */
  .cm-back-bar {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    background: #060e08;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.3s ease;
  }
  .cm-back-bar:hover { background: var(--green); }
  .cm-back-bar.visible { display: flex; }
  .cm-back-bar__arrow { font-size: 12px; color: var(--accent-bright); line-height: 1; }
  .cm-back-bar__label {
    font-family: var(--font-body);
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-secondary);
  }
  .cm-back-bar__from {
    font-family: var(--font-heading);
    font-size: 13px;
    font-style: italic;
    color: var(--text-white);
    margin-left: 4px;
  }

  /* Viewer */
  .cm-viewer {
    position: relative;
    background: #000;
    overflow: hidden;
    line-height: 0;
    min-height: 220px;
    border: 1px solid var(--border);
    box-shadow: inset 0 0 0 3px rgba(0,0,0,0.6), inset 0 0 0 4px var(--border);
  }
  /* engraved tracery corners */
  .cm-viewer::before, .cm-viewer::after {
    content: '';
    position: absolute;
    width: 18px; height: 18px;
    border: 1px solid var(--accent-border);
    z-index: 15;
    pointer-events: none;
  }
  .cm-viewer::before { top: 8px; left: 8px; border-right: none; border-bottom: none; }
  .cm-viewer::after  { bottom: 8px; right: 8px; border-left: none; border-top: none; }
  .cm-viewer.img-error::after {
    content: 'Image loading…';
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-body);
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
    line-height: 1.4;
  }
  .cm-viewer__img {
    width: 100%;
    display: block;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  .cm-viewer__img.loaded { opacity: 1; }

  /* Hotspots */
  .cm-hotspot {
    position: absolute;
    transform: translate(-50%, -50%);
    width: 40px;
    height: 40px;
    cursor: pointer;
    z-index: 10;
    /* invisible tap padding extends the touch target beyond the visible dot */
    padding: 8px;
    margin: -8px;
  }
  .cm-hotspot__dot {
    position: relative;
    width: 100%;
    height: 100%;
  }

  /* Instrument ring — fine outer bezel with tick marks */
  .cm-hotspot__pulse {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid rgba(58,140,82,0.7);
    animation: hs-pulse 3s ease-in-out infinite;
  }
  /* tick marks around the bezel, drawn with a conic mask */
  .cm-hotspot__dot::before {
    content: '';
    position: absolute;
    inset: 2px;
    border-radius: 50%;
    background:
      repeating-conic-gradient(
        var(--accent-bright) 0deg 1.2deg,
        transparent 1.2deg 30deg
      );
    -webkit-mask: radial-gradient(circle, transparent 0 44%, #000 44% 50%, transparent 50%);
            mask: radial-gradient(circle, transparent 0 44%, #000 44% 50%, transparent 50%);
    opacity: 0.5;
    pointer-events: none;
  }
  .cm-hotspot__core {
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    background: var(--green-vivid);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 500;
    color: var(--text-white);
    border: 1px solid rgba(184,145,92,0.5);  /* brass bezel ring */
    cursor: pointer;
    transition: background 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
    box-shadow: 0 2px 14px rgba(58,140,82,0.45), inset 0 1px 2px rgba(255,255,255,0.12);
  }
  .cm-hotspot__core:hover { background: #4daa68; transform: scale(1.12); }
  .cm-hotspot.active .cm-hotspot__core {
    background: #fff;
    color: var(--accent);
    transform: scale(1.15);
    box-shadow: 0 2px 20px rgba(255,255,255,0.3);
  }
  .cm-hotspot.active .cm-hotspot__pulse { border-color: rgba(184,145,92,0.5); animation: none; }

  @keyframes hs-pulse {
    0%, 100% { transform: scale(1); opacity: 0.7; }
    60%       { transform: scale(1.6); opacity: 0; }
  }




  /* Label strip — sits between image and panel; works on hover (desktop) and tap (mobile) */
  .cm-label-strip {
    background: #060e08;
    border: 1px solid var(--border);
    border-top: none;
    border-bottom: none;
    overflow: hidden;
    max-height: 0;
    opacity: 0;
    transition: max-height 0.3s ease, opacity 0.3s ease;
  }
  .cm-label-strip.show { max-height: 60px; opacity: 1; }
  .cm-label-strip__inner {
    padding: 13px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .cm-label-strip__mark {
    width: 5px; height: 5px;
    background: var(--green-vivid);
    transform: rotate(45deg);
    flex-shrink: 0;
  }
  .cm-label-strip__text {
    font-family: var(--font-heading);
    font-style: italic;
    font-size: 17px;
    color: var(--text-white);
    line-height: 1;
  }

  /* Info Panel */
  .cm-panel {
    background: var(--bg-panel);
    border: 1px solid var(--border-strong);
    border-top: none;
    overflow: hidden;
    max-height: 0;
    opacity: 0;
    transition: max-height 0.5s cubic-bezier(0.4,0,0.2,1), opacity 0.4s ease;
  }
  .cm-panel.open { max-height: 600px; opacity: 1; }

  .cm-panel__inner {
    padding: 26px 32px;
    display: flex;
    gap: 28px;
    align-items: flex-start;
    border-left: 3px solid var(--accent-bright);
  }
  @media (max-width: 600px) { .cm-panel__inner { padding: 20px 18px; gap: 0; flex-direction: column; } }

  .cm-panel__num {
    font-family: var(--font-heading);
    font-size: 56px;
    font-weight: 300;
    color: var(--accent-border);
    line-height: 1;
    flex-shrink: 0;
    letter-spacing: -0.02em;
    min-width: 52px;
  }
  @media (max-width: 600px) { .cm-panel__num { font-size: 38px; margin-bottom: 10px; } }

  .cm-panel__body { flex: 1; min-width: 0; }

  .cm-panel__zone {
    font-family: var(--font-heading);
    font-size: clamp(20px, 2.5vw, 28px);
    font-weight: 400;
    font-style: italic;
    color: var(--text-white);
    margin-bottom: 10px;
    line-height: 1.2;
  }
  .cm-panel__desc {
    font-family: var(--font-body);
    font-weight: 300;
    font-size: 12.5px;
    line-height: 1.85;
    color: var(--text-secondary);
    max-width: 680px;
  }

  .cm-panel__close {
    background: none;
    border: 1px solid var(--border);
    cursor: pointer;
    color: var(--text-muted);
    font-size: 11px;
    padding: 6px 8px;
    flex-shrink: 0;
    line-height: 1;
    transition: color 0.3s ease, border-color 0.3s ease;
    align-self: flex-start;
  }
  .cm-panel__close:hover { color: var(--accent-bright); border-color: var(--accent-border); }

  /* ── Details view ── */
  .cm-details { display: none; }
  .cm-details.active { display: block; }
  .cm-details__intro {
    text-align: center;
    font-family: var(--font-heading);
    font-style: italic;
    font-size: clamp(18px, 2.4vw, 26px);
    font-weight: 400;
    color: var(--text-white);
    margin: 28px 0 30px;
    line-height: 1.3;
  }
  .cm-acc { border-top: 1px dashed var(--border-strong); }
  .cm-acc__item { border-bottom: 1px dashed var(--border-strong); }
  .cm-acc__head {
    width: 100%;
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 22px 8px;
    text-align: left;
    transition: color 0.3s ease;
  }
  .cm-acc__head:hover { color: var(--accent-bright); }
  .cm-acc__title {
    font-family: var(--font-heading);
    font-style: italic;
    font-size: clamp(19px, 2.4vw, 25px);
    font-weight: 400;
    color: var(--text-white);
    line-height: 1.2;
    transition: color 0.3s ease;
  }
  .cm-acc__head:hover .cm-acc__title { color: var(--accent-bright); }
  .cm-acc__sign {
    flex-shrink: 0;
    width: 22px; height: 22px;
    position: relative;
    color: var(--accent-bright);
  }
  .cm-acc__sign::before, .cm-acc__sign::after {
    content: '';
    position: absolute;
    background: currentColor;
    transition: transform 0.4s cubic-bezier(0.4,0,0.2,1), opacity 0.4s ease;
  }
  .cm-acc__sign::before { top: 50%; left: 0; width: 100%; height: 1px; transform: translateY(-50%); }
  .cm-acc__sign::after  { left: 50%; top: 0; height: 100%; width: 1px; transform: translateX(-50%); }
  .cm-acc__item.open .cm-acc__sign::after { transform: translateX(-50%) scaleY(0); opacity: 0; }
  .cm-acc__body {
    overflow: hidden;
    max-height: 0;
    opacity: 0;
    transition: max-height 0.5s cubic-bezier(0.4,0,0.2,1), opacity 0.4s ease;
  }
  .cm-acc__item.open .cm-acc__body { max-height: 600px; opacity: 1; }
  .cm-acc__list {
    list-style: none;
    padding: 0 8px 26px;
    margin: 0;
    columns: 2;
    column-gap: 36px;
  }
  @media (max-width: 600px) { .cm-acc__list { columns: 1; } }
  .cm-acc__list li {
    font-family: var(--font-body);
    font-weight: 300;
    font-size: 13px;
    line-height: 1.5;
    color: var(--text-secondary);
    padding: 7px 0 7px 18px;
    position: relative;
    break-inside: avoid;
  }
  .cm-acc__list li::before {
    content: '';
    position: absolute;
    left: 0; top: 13px;
    width: 4px; height: 4px;
    background: var(--accent-bright);
    transform: rotate(45deg);
  }

  /* Footer stitch line */
  .cm-footer-line {
    margin-top: 32px;
    border-top: 1px dashed var(--border-strong);
  }

  /* Hint */
  .cm-hint {
    margin-top: 20px;
    text-align: center;
    font-family: var(--font-body);
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  /* Mobile */
  @media (max-width: 480px) {
    .cm-tool { padding: 24px 14px 40px; }
    .cm-nav__btn { padding: 10px 10px; font-size: 9px; letter-spacing: 0.12em; }
    .cm-panel__inner { padding: 16px 14px; }
  }

</style>
</head>
<body>
<div class="cm-tool">

  <div class="cm-header">
    <div class="cm-header__eyebrow">Building Impossible Interiors</div>
    <h1 class="cm-header__title">Reimagine Your Interior</h1>
    <div class="cm-header__subtitle">See what's possible across every surface of your cabin</div>
  </div>

  <div class="cm-divider">
    <div class="cm-divider__line"></div>
    <svg class="cm-divider__arch" viewBox="0 0 40 40" aria-hidden="true">
      <g fill="none" stroke="currentColor">
        <path d="M20 1 L33 20 L20 39 L7 20 Z" stroke-width="1"/>
        <path d="M20 7 L28 20 L20 33 L12 20 Z" stroke-width="0.6" opacity="0.55"/>
      </g>
      <circle cx="20" cy="20" r="1.4" fill="currentColor"/>
    </svg>
    <div class="cm-divider__line"></div>
  </div>

  <nav class="cm-nav" role="tablist" id="main-nav">
    <button class="cm-nav__btn active" data-view="front" role="tab">Front Cabin</button>
    <button class="cm-nav__btn" data-view="rear" role="tab">Rear Cabin</button>
    <button class="cm-nav__btn" data-view="details" role="tab">Details</button>
  </nav>

  <div class="cm-back-bar" id="back-bar" role="button" tabindex="0" aria-label="Return to Front Cabin">
    <span class="cm-back-bar__arrow">←</span>
    <span class="cm-back-bar__label">Return to</span>
    <span class="cm-back-bar__from" id="back-label">Front Cabin</span>
  </div>

  <div class="cm-viewer" id="viewer">
    <img class="cm-viewer__img" id="main-img" src="" alt="" />
  </div>

  <div class="cm-label-strip" id="label-strip">
    <div class="cm-label-strip__inner">
      <span class="cm-label-strip__mark"></span>
      <span class="cm-label-strip__text" id="label-strip-text"></span>
    </div>
  </div>

  <div class="cm-panel" id="info-panel" aria-live="polite">
    <div class="cm-panel__inner">
      <div class="cm-panel__num" id="panel-num">01</div>
      <div class="cm-panel__body">
        <div class="cm-panel__zone" id="panel-zone"></div>

      </div>
      <button class="cm-panel__close" id="panel-close" aria-label="Close">✕</button>
    </div>
  </div>

  <p class="cm-hint" id="explorer-hint">Click the markers to explore</p>

  <!-- ── DETAILS VIEW ── -->
  <div class="cm-details" id="details-view">
    <p class="cm-details__intro">Where upholstery ends, our work continues.</p>
    <div class="cm-acc" id="acc"></div>
  </div>

  <div class="cm-footer-line"></div>

</div>

const ZONES = {
  'front-seats':      { name: 'Front Seats',        desc: 'The focal point of every interior transformation. Chrome Mercy works with full-grain leather, alcantara, and suede — each seat sculpted with bespoke stitching patterns, channel quilting, or panel inlays unique to every commission.' },

  'grab-handles':     { name: 'Grab Handles',        desc: 'Small in scale, significant in effect. Upholstered grab handles in matching leather or alcantara complete the interior at the detail level — the level at which a discerning eye measures true craftsmanship.' }
};

// State
let currentShot  = 0;
let previousShot = 0;

// DOM
const viewer    = document.getElementById('viewer');
const mainImg   = document.getElementById('main-img');
const panel     = document.getElementById('info-panel');
const panelNum  = document.getElementById('panel-num');
const panelZone = document.getElementById('panel-zone');
const panelDesc = document.getElementById('panel-desc');
const backBar   = document.getElementById('back-bar');
const backLabel = document.getElementById('back-label');
const navBtns   = document.querySelectorAll('.cm-nav__btn');
const labelStrip     = document.getElementById('label-strip');
const labelStripText = document.getElementById('label-strip-text');
let   labelHideTimer = null;

function showLabelStrip(text) {
  clearTimeout(labelHideTimer);
  labelStripText.textContent = text;
  labelStrip.classList.add('show');
  setTimeout(notifyHeight, 320);
}
function hideLabelStrip() {
  labelStrip.classList.remove('show');
  clearTimeout(labelHideTimer);
  setTimeout(notifyHeight, 320);
}

function goToShot(idx, fromIdx) {
  const shot = SHOTS[idx];
  if (!shot) return;
  if (shot.isCloseup) previousShot = (fromIdx !== undefined) ? fromIdx : currentShot;
  currentShot = idx;

  mainImg.classList.remove('loaded');
  mainImg.src = shot.img;
  mainImg.alt = shot.alt;
  viewer.classList.remove('img-error');
  mainImg.onload  = () => { mainImg.classList.add('loaded'); viewer.classList.remove('img-error'); notifyHeight(); };
  mainImg.onerror = () => { mainImg.classList.remove('loaded'); viewer.classList.add('img-error'); };

  viewer.querySelectorAll('.cm-hotspot').forEach(h => h.remove());
  shot.hotspots.forEach(hs => {
    const wrap = document.createElement('div');
    wrap.className = 'cm-hotspot';
    wrap.style.left = hs.x + '%';
    wrap.style.top  = hs.y + '%';
    // Navigate dots are plain (no number), info dots show number
    const icon = hs.type === 'navigate' ? '' : hs.id;
    const labelText = (hs.type === 'navigate' && SHOTS[hs.navigateTo])
      ? SHOTS[hs.navigateTo].navLabel
      : ZONES[hs.zone].name;
    wrap.innerHTML = `
      <div class="cm-hotspot__dot">
        <div class="cm-hotspot__pulse"></div>
        <button class="cm-hotspot__core" aria-label="${labelText}">${icon}</button>
      </div>`;
    // Hover (desktop) shows the name in the strip
    wrap.addEventListener('mouseenter', () => showLabelStrip(labelText));
    wrap.addEventListener('mouseleave', () => hideLabelStrip());
    wrap.querySelector('.cm-hotspot__core').addEventListener('click', () => handleHotspot(wrap, hs));
    viewer.appendChild(wrap);
  });

  // Nav tab highlight
  navBtns.forEach(b => { b.classList.remove('active'); b.removeAttribute('aria-selected'); });
  const rearShots = [S.REAR_SEATS, S.BOOT, S.SEATBELTS, S.REAR_DOOR_CARD];
  const hubView = rearShots.includes(shot.isCloseup ? previousShot : idx) ? 'rear' : 'front';
  const activeBtn = document.querySelector(`.cm-nav__btn[data-view="${hubView}"]`);
  if (activeBtn) { activeBtn.classList.add('active'); activeBtn.setAttribute('aria-selected','true'); }

  // Back bar
  if (shot.isCloseup) {
    backLabel.textContent = SHOTS[previousShot] ? SHOTS[previousShot].navLabel : 'Front Cabin';
    backBar.classList.add('visible');
  } else {
    backBar.classList.remove('visible');
  }

  hideLabelStrip();
  closePanel();
}

function handleHotspot(el, hs) {
  if (hs.type === 'navigate') {
    const lbl = SHOTS[hs.navigateTo] ? SHOTS[hs.navigateTo].navLabel : '';
    showLabelStrip(lbl);
    setTimeout(() => { hideLabelStrip(); goToShot(hs.navigateTo, currentShot); }, 450);
    return;
  }
  const wasActive = el.classList.contains('active');
  viewer.querySelectorAll('.cm-hotspot').forEach(h => h.classList.remove('active'));
  if (wasActive) { closePanel(); return; }
  el.classList.add('active');
  panelNum.textContent  = String(hs.id).padStart(2,'0');
  panelZone.textContent = ZONES[hs.zone].name;
  panelDesc.textContent = ZONES[hs.zone].desc;
  panel.classList.add('open');
  setTimeout(() => { panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); notifyHeight(); }, 80);
}

function closePanel() {
  panel.classList.remove('open');
  viewer.querySelectorAll('.cm-hotspot').forEach(h => h.classList.remove('active'));
  setTimeout(notifyHeight, 300);
}

// View switching: front / rear / details
const explorerEls = [viewer, panel, document.getElementById('explorer-hint'), backBar];
const detailsView = document.getElementById('details-view');

function showView(view) {
  navBtns.forEach(b => { b.classList.remove('active'); b.removeAttribute('aria-selected'); });
  const btn = document.querySelector(`.cm-nav__btn[data-view="${view}"]`);
  if (btn) { btn.classList.add('active'); btn.setAttribute('aria-selected','true'); }

  if (view === 'details') {
    // Hide explorer, show details accordion
    viewer.style.display = 'none';
    panel.style.display = 'none';
    document.getElementById('explorer-hint').style.display = 'none';
    backBar.classList.remove('visible');
    detailsView.classList.add('active');
    closePanel();
  } else {
    viewer.style.display = '';
    panel.style.display = '';
    document.getElementById('explorer-hint').style.display = '';
    detailsView.classList.remove('active');
    goToShot(view === 'rear' ? S.REAR_SEATS : S.FRONT_CABIN);
  }
  setTimeout(notifyHeight, 120);
}

navBtns.forEach(btn => btn.addEventListener('click', () => showView(btn.dataset.view)));
backBar.addEventListener('click', () => goToShot(previousShot));
backBar.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') goToShot(previousShot); });
document.getElementById('panel-close').addEventListener('click', closePanel);

// Wix iframe auto-resize
function notifyHeight() {
  const height = document.documentElement.scrollHeight;
  window.parent.postMessage({ type: 'iwanttobesolarge', value: height }, '*');
}
const resizeObserver = new ResizeObserver(() => notifyHeight());
resizeObserver.observe(document.body);
window.addEventListener('load', notifyHeight);
setTimeout(notifyHeight, 500);
setTimeout(notifyHeight, 1500);

// Build Details accordion
const acc = document.getElementById('acc');
DETAILS.forEach((cat, i) => {
  const item = document.createElement('div');
  item.className = 'cm-acc__item';
  const listHtml = cat.items.map(it => `<li>${it}</li>`).join('');
  item.innerHTML = `
    <button class="cm-acc__head" aria-expanded="false">
      <span class="cm-acc__title">${cat.title}</span>
      <span class="cm-acc__sign" aria-hidden="true"></span>
    </button>
    <div class="cm-acc__body"><ul class="cm-acc__list">${listHtml}</ul></div>`;
  const head = item.querySelector('.cm-acc__head');
  head.addEventListener('click', () => {
    const isOpen = item.classList.contains('open');
    // close all
    acc.querySelectorAll('.cm-acc__item').forEach(x => {
      x.classList.remove('open');
      x.querySelector('.cm-acc__head').setAttribute('aria-expanded','false');
    });
    if (!isOpen) {
      item.classList.add('open');
      head.setAttribute('aria-expanded','true');
    }
    setTimeout(notifyHeight, 520);
  });
  acc.appendChild(item);
});

goToShot(S.FRONT_CABIN);
